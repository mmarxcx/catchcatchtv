<!DOCTYPE html>
<html lang="en">
<head>
<script nonce="{{ g.csp_nonce }}">if(localStorage.getItem("cctv_dark_mode")==="1")document.documentElement.classList.add("dark-mode");</script>

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CatchCatchTV — Reset Password</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><div class="brand-dot"></div><span class="brand-name">CatchCatchTV</span></div>
    <h1 class="auth-heading">New Password</h1>
    <p class="auth-sub">Choose a strong new password for your account.</p>
    <div class="err-box hidden" id="err"></div>
    <div class="ok-box hidden" id="ok"></div>
    <div class="field-group">
      <label class="field-label">New Password</label>
      <input class="field-input" id="password" type="password" placeholder="••••••••" oninput="checkPw()">
      <div class="pw-rules">
        <div class="pw-rule" id="rule-len"><span class="rule-icon">✓</span><span>At least 8 characters</span></div>
        <div class="pw-rule" id="rule-upper"><span class="rule-icon">✓</span><span>One uppercase letter</span></div>
        <div class="pw-rule" id="rule-num"><span class="rule-icon">✓</span><span>One number</span></div>
        <div class="pw-rule" id="rule-special"><span class="rule-icon">✓</span><span>One special character</span></div>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Confirm Password</label>
      <input class="field-input" id="confirm" type="password" placeholder="••••••••" oninput="checkConfirm()">
      <div class="pw-rule" id="rule-match" style="margin-top:6px"><span class="rule-icon">✓</span><span>Passwords match</span></div>
    </div>
    <button class="btn-primary" id="btn">Set New Password</button>
    <p class="auth-footer"><a href="/login">← Back to Login</a></p>
  </div>
</div>
<script nonce="{{ g.csp_nonce }}">
const TOKEN = new URLSearchParams(window.location.search).get('token') || '';
function checkRule(id,met){document.getElementById(id).classList.toggle('met',met);}
function checkPw(){
  const v=document.getElementById('password').value;
  checkRule('rule-len',v.length>=8);
  checkRule('rule-upper',/[A-Z]/.test(v));
  checkRule('rule-num',/[0-9]/.test(v));
  checkRule('rule-special',/[^A-Za-z0-9]/.test(v));
  checkConfirm();
}
function checkConfirm(){
  const pw=document.getElementById('password').value;
  const co=document.getElementById('confirm').value;
  checkRule('rule-match',co.length>0&&pw===co);
}
const btn=document.getElementById('btn');
async function go(){
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  const errEl=document.getElementById('err'),okEl=document.getElementById('ok');
  errEl.classList.add('hidden');okEl.classList.add('hidden');
  if(!TOKEN){errEl.textContent='Invalid or missing reset token.';errEl.classList.remove('hidden');return;}
  if(password!==confirm){errEl.textContent='Passwords do not match.';errEl.classList.remove('hidden');return;}
  if(password.length<8){errEl.textContent='Password must be at least 8 characters.';errEl.classList.remove('hidden');return;}
  btn.disabled=true;btn.textContent='Saving…';
  try{
    const r=await fetch('/api/reset-password',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:TOKEN,password})});
    const b=await r.json();
    if(r.ok){
      okEl.textContent='Password updated! Redirecting to login…';
      okEl.classList.remove('hidden');
      setTimeout(()=>window.location.href='/login',2000);
    } else {
      errEl.textContent=b.error||'Reset failed. The link may have expired.';
      errEl.classList.remove('hidden');
    }
  }catch(e){errEl.textContent='Network error.';errEl.classList.remove('hidden');}
  finally{btn.disabled=false;btn.textContent='Set New Password';}
}
btn.addEventListener('click',go);
document.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
</script>
</body></html>
